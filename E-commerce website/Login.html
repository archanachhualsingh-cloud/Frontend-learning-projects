<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login | ShopNest</title>
  </head>
  <body>
    <header>
      <figure>
        <img
          src="image/image.png"
          alt="E-commerce logo"
          height="300px"
          title="logo"
        />
      </figure>
      <h1>Welcome Back</h1>
      <p>Please login to continue shopping</p>
    </header>
    <main>
      <section>
        <form action="#" method="post">
          <fieldset>
            <legend>Login Info:</legend>
            <label for="userId">UserName/Email</label>
            <input
              type="text"
              id="userId"
              name="usernameOremail"
              placeholder="Enter UserName or Email"
              required
            /><br />
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
            />
          </fieldset>
          <label for="Remember">Remember Me ?</label>
          <input
            type="checkbox"
            id="Remember"
            name="remember"
            value="remember"
          /><br />
          <a href="assests/forgot.html">Forgot Password?</a>
          <button type="submit">Log In</button>
        </form>
      </section>
      <section>
        <p>Don't have an account?</p>
        <a href="signup.html">Sign Up</a>
        <button type="button">Continue with Google</button>
      </section>
    </main>
    <footer>
      <p>
        
        © 2026 E-Commerce.

          All Rights Reserved..
      </p>
    </footer>
  </body>
</html>
